plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (isReleaseBuild && !keystorePropertiesFile.exists() && System.getenv('MADINI_ALLOW_DEBUG_SIGNING') != '1') {
    throw new GradleException('android/key.properties haipo. Tengeneza release keystore (angalia android/key.properties.example). Kwa jaribio la ndani tu: weka MADINI_ALLOW_DEBUG_SIGNING=1.')
}

android {
    namespace = "tz.madini.madini"
    // Google Play (tangu 31 Aug 2026): apps mpya/masasisho lazima zilenge API 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "tz.madini.madini"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Release hutumia key.properties; debug signing inaruhusiwa tu kwa
            // jaribio la ndani kupitia MADINI_ALLOW_DEBUG_SIGNING=1.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
