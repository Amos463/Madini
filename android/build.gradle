allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// MADINI: lazimisha Android API 36 kwa moduli za plugins za Flutter.
// LAZIMA iwe KABLA ya evaluationDependsOn (vinginevyo afterEvaluate inakataliwa).
subprojects {
    def enforceSdk = { p ->
        def androidExtension = p.extensions.findByName("android")
        if (androidExtension != null) {
            androidExtension.compileSdkVersion(36)
        }
    }
    if (project.state.executed) {
        enforceSdk(project)
    } else {
        afterEvaluate { p -> enforceSdk(p) }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
