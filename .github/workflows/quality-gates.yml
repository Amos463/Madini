name: MADINI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable (>= 3.35 inahitajika kwa Android SDK 36)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and create lockfile
        run: flutter pub get

      - name: Upload pubspec.lock (commit it to the repository)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Static analysis (errors and warnings fail the build)
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Install Gradle 8.12 and generate wrapper
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.12/bin/gradle -p android wrapper --gradle-version 8.12

      - name: Android debug APK
        run: flutter build apk --debug

      - name: Release APK (debug-signed, kwa ukaguzi wa 16 KB tu) na ukaguzi wa alignment
        env:
          MADINI_ALLOW_DEBUG_SIGNING: "1"
        run: |
          flutter build apk --release
          bash scripts/check_16kb.sh build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: madini-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    # Inaendeshwa kwa mkono tu (workflow_dispatch); inahitaji secrets za keystore.
    if: github.event_name == 'workflow_dispatch'
    needs: flutter-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Gradle wrapper
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.12/bin/gradle -p android wrapper --gradle-version 8.12
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secrets za keystore hazipo"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOP
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOP
      - name: Build signed AAB and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release
          bash scripts/check_16kb.sh build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: madini-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
